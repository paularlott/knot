version: "3"

vars:
  PROJECT_NAME: knot
  PLATFORMS:
    - linux/amd64
    - linux/arm64
    - darwin/amd64
    - darwin/arm64
    - windows/amd64
    - windows/arm64
  AGENT_PLATFORMS:
    - linux/amd64
    - linux/arm64
    - darwin/amd64
    - darwin/arm64
  BUILT_AT:
    sh: date +%Y%m%d.%H%M%S%z
  BUILD_FLAGS: '-ldflags="-s -w -X github.com/paularlott/knot/build.Date={{.BUILT_AT}}" -trimpath'
  OUTPUT_DIR: bin
  AGENT_OUTPUT_DIR: web/agents
  VERSION:
    sh: go run ./scripts/getversion
  REGISTRY: '{{.REGISTRY | default "paularlott"}}'
  HUB: '{{.HUB | default "registry-1.docker.io/"}}'
  BUILD_WITH:
    sh: |
      if [ -n "${BUILD_WITH}" ]; then
        echo "${BUILD_WITH}"
      elif command -v docker >/dev/null 2>&1; then
        echo "docker"
      elif command -v podman >/dev/null 2>&1; then
        echo "podman"
      elif command -v container >/dev/null 2>&1; then
        echo "apple"
      else
        echo "none"
      fi
  PLATFORM_ARG: "--platform linux/amd64,linux/arm64"

tasks:
  default:
    desc: Build the binary for all platforms (default task)
    deps: [all]

  build:
    desc: Build the binary for the current platform
    deps: [agents, packages, apidocs, webassets, legal-license, legal-notice]
    vars:
      GOOS: '{{OS | default "linux"}}'
      GOARCH: '{{ARCH | default "amd64"}}'
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - legal/license.txt
      - legal/notice.txt
    generates:
      - "{{.OUTPUT_DIR}}/{{.PROJECT_NAME}}"

  build-macos:
    desc: Build the macOS Knot.app package for the current platform
    deps: [agents, packages, apidocs, webassets, legal-license, legal-notice]
    cmds:
      - task: build-platform
        vars: { PLATFORM: "darwin/{{ARCH}}" }
      # Extract the app so it can be opened directly for testing
      - rm -rf {{.OUTPUT_DIR}}/Knot.app
      - unzip -q {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}_darwin_{{ARCH}}.zip -d {{.OUTPUT_DIR}}

  build-amd64:
    desc: Build the binary for the current platform
    deps: [agents, packages, apidocs, webassets, legal-license, legal-notice]
    env:
      GOOS: "linux"
      GOARCH: "amd64"
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - legal/license.txt
      - legal/notice.txt
    generates:
      - "{{.OUTPUT_DIR}}/{{.PROJECT_NAME}}"

  build-arm64:
    desc: Build the binary for the current platform
    deps: [agents, packages, apidocs, webassets, legal-license, legal-notice]
    env:
      GOOS: "linux"
      GOARCH: "arm64"
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - legal/license.txt
      - legal/notice.txt
    generates:
      - "{{.OUTPUT_DIR}}/{{.PROJECT_NAME}}"

  knot-dns:
    desc: Build the knot-dns binary for all platforms
    deps: [legal-license, legal-notice]
    cmds:
      - task: build-knot-dns-platform
        vars: { PLATFORM: "{{.ITEM}}" }
        for:
          var: "PLATFORMS"
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - legal/license.txt
      - legal/notice.txt
      - web/**/*
    generates:
      - "{{.OUTPUT_DIR}}/knot-dns_{{.PLATFORMS}}"

  build-knot-dns-platform:
    internal: true
    label: "Building for {{.PLATFORM}}"
    vars:
      GOOS: '{{splitList "/" .PLATFORM | first}}'
      GOARCH: '{{splitList "/" .PLATFORM | last}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
      OUTPUT_FILE: "{{.OUTPUT_DIR}}/knot-dns_{{.GOOS}}_{{.GOARCH}}{{.EXT}}"
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
    cmds:
      - go build {{$.BUILD_FLAGS}} -o {{.OUTPUT_FILE}} ./dns-server

  all:
    desc: Build the binary for all platforms
    deps: [agents, packages, apidocs, webassets, legal-license, legal-notice]
    cmds:
      - task: build-platform
        vars: { PLATFORM: "{{.ITEM}}" }
        for:
          var: "PLATFORMS"
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - legal/license.txt
      - legal/notice.txt
      - web/**/*
    generates:
      - "{{.OUTPUT_DIR}}/{{.PROJECT_NAME}}_{{.PLATFORMS}}*.zip"

  build-platform:
    internal: true
    label: "Building for {{.PLATFORM}}"
    vars:
      GOOS: '{{splitList "/" .PLATFORM | first}}'
      GOARCH: '{{splitList "/" .PLATFORM | last}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
      OUTPUT_FILE: "{{.OUTPUT_DIR}}/{{$.PROJECT_NAME}}_{{.GOOS}}_{{.GOARCH}}{{.EXT}}"
      ZIP_FILE: "{{$.PROJECT_NAME}}_{{.GOOS}}_{{.GOARCH}}{{.EXT}}.zip"
      FINAL_NAME: "{{$.PROJECT_NAME}}{{.EXT}}"
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
    cmds:
      - go build {{$.BUILD_FLAGS}} -o {{.OUTPUT_FILE}} .
      - |
        if [ "{{.GOOS}}" = "darwin" ]; then
          # macOS builds ship as a .app bundle (menu bar tray desktop mode)
          APP="{{$.OUTPUT_DIR}}/Knot.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "{{.OUTPUT_FILE}}" "$APP/Contents/MacOS/{{$.PROJECT_NAME}}"
          cp build/darwin/icon.icns "$APP/Contents/Resources/"
          sed "s/0\.0\.0/{{$.VERSION}}/g" build/darwin/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          rm -f "{{$.OUTPUT_DIR}}/{{.ZIP_FILE}}"
          cd {{$.OUTPUT_DIR}} && zip -r --symlinks "{{.ZIP_FILE}}" "Knot.app"
          rm -rf "$APP"
        else
          cd {{$.OUTPUT_DIR}} && \
          mv {{$.PROJECT_NAME}}_{{.GOOS}}_{{.GOARCH}}{{.EXT}} {{.FINAL_NAME}} && \
          zip {{.ZIP_FILE}} {{.FINAL_NAME}}
        fi
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - legal/license.txt
      - legal/notice.txt
      - web/**/*
    generates:
      - "{{.OUTPUT_DIR}}/{{.ZIP_FILE}}"

  agents:
    desc: Build the agent binaries
    cmds:
      - rm -f {{.AGENT_OUTPUT_DIR}}/knot_agent*.zip {{.AGENT_OUTPUT_DIR}}/knot-agent # Clean previous agent builds first
      - task: build-agent
        vars: { PLATFORM: "{{.ITEM}}" }
        for:
          var: "AGENT_PLATFORMS"
    sources:
      - ./agent/**/*.go
      - ./internal/**/*.go
      - ./build/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.AGENT_OUTPUT_DIR}}/{{.PROJECT_NAME}}_agent_*.zip" # Pattern for generated files

  packages:
    desc: Build the scriptling packages
    cmds:
      - mkdir -p web/packages
      - |
        echo 'name = "knot"' > internal/scriptling/manifest.toml
        echo 'version = "{{.VERSION}}"' >> internal/scriptling/manifest.toml
        echo 'description = "Knot API client library for scriptling"' >> internal/scriptling/manifest.toml
        cd internal/scriptling && zip -r ../../web/packages/knot.zip manifest.toml lib/
      - shasum -a 256 web/packages/knot.zip | cut -d' ' -f1 > web/packages/knot.zip.sha256
    sources:
      - ./internal/scriptling/lib/knot/*.py
    generates:
      - web/packages/knot.zip
      - web/packages/knot.zip.sha256

  build-agent:
    internal: true
    label: "Building agent for {{.PLATFORM}}"
    vars:
      GOOS: '{{splitList "/" .PLATFORM | first}}'
      GOARCH: '{{splitList "/" .PLATFORM | last}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
      OUTPUT_FILE: "{{.AGENT_OUTPUT_DIR}}/{{$.PROJECT_NAME}}_agent_{{.GOOS}}_{{.GOARCH}}{{.EXT}}"
      ZIP_FILE: "{{.AGENT_OUTPUT_DIR}}/{{$.PROJECT_NAME}}_agent_{{.GOOS}}_{{.GOARCH}}{{.EXT}}.zip"
      FINAL_NAME: "knot-agent{{.EXT}}"
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
    cmds:
      - go build {{$.BUILD_FLAGS}} -o {{.OUTPUT_FILE}} ./agent
      - |
        cd {{$.AGENT_OUTPUT_DIR}} && \
        mv {{$.PROJECT_NAME}}_agent_{{.GOOS}}_{{.GOARCH}}{{.EXT}} {{.FINAL_NAME}} && \
        zip {{$.PROJECT_NAME}}_agent_{{.GOOS}}_{{.GOARCH}}{{.EXT}}.zip {{.FINAL_NAME}} && \
        rm -f {{.FINAL_NAME}}
    sources:
      - ./agent/**/*.go
      - ./internal/**/*.go
      - ./build/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.ZIP_FILE}}"

  checksums:
    desc: Show the ZIP file checksums
    cmds:
      - shasum -a 256 {{.OUTPUT_DIR}}/*.zip

  homebrew-formula:
    desc: Generate the Homebrew formula and cask
    method: none
    cmds:
      - go run ./scripts/homebrew-formula/ -out ../homebrew-tap
    sources:
      - ./scripts/homebrew-formula/**/*.go
    generates:
      - ../homebrew-tap/Formula/knot.rb
      - ../homebrew-tap/Casks/knot.rb

  legal:
    desc: Generate the third-party license report in the project root
    cmds:
      - go-licenses report --ignore github.com/paularlott/knot --ignore github.com/golang/freetype --ignore github.com/yeqown/reedsolomon ./... > THIRD_PARTY_LICENSES.txt
    sources:
      - go.mod
      - go.sum
      - ./**/*.go
    generates:
      - THIRD_PARTY_LICENSES.txt

  legal-license:
    desc: Copy the application license file for inclusion in the binary
    internal: true
    cmds:
      - cat LICENSE.txt > legal/license.txt
    sources:
      - LICENSE.txt
    generates:
      - legal/license.txt
    method: checksum # Re-run only if LICENSE.txt changes

  legal-notice:
    desc: Copy the application notice file for inclusion in the binary
    internal: true
    cmds:
      - cat NOTICE.txt > legal/notice.txt
    sources:
      - NOTICE.txt
    generates:
      - legal/notice.txt
    method: checksum # Re-run only if NOTICE.txt changes

  apidocs:
    desc: Generate the API documentation
    cmds:
      - npx @redocly/cli build-docs --output ./web/public_html/api-docs/index.html --config ./redocly-config.yaml --disableGoogleFont
      - sed -i.bak 's|<script src="https.*</script>||g' ./web/public_html/api-docs/index.html && rm ./web/public_html/api-docs/index.html.bak
    sources:
      - internal/api/spec/knot-openapi.yaml
      - internal/api/spec/chat.yaml
      - redocly-config.yaml
    generates:
      - ./web/public_html/api-docs/index.html

  apidocs-preview:
    desc: Run a preview server for the API documentation
    cmds:
      - npx @redocly/cli preview-docs internal/api/spec/knot-openapi.yaml

  webassets:
    desc: Compile LESS/CSS and JavaScript
    cmds:
      - npx vite build
    sources:
      - vite.config.js # Or relevant config
      - src/**/* # Assuming source files are here
    generates:
      - web/public_html/css/*
      - web/public_html/js/*

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test-mcptools:
    desc: Run MCP tool tests (schema sweep + in-process execution against mock API)
    cmds:
      - go test ./internal/mcptools/... -v

  watch:
    desc: Watch for changes in LESS, CSS, JavaScript files and recompile
    cmds:
      - npx vite build --watch

  clean:
    desc: Remove the previous build artifacts
    cmds:
      - rm -rf {{.OUTPUT_DIR}}/*
      - rm -rf {{.AGENT_OUTPUT_DIR}}/*
      - rm -f legal/license.txt
      - rm -f legal/notice.txt
      - rm -f THIRD_PARTY_LICENSES.txt
      - rm -rf web/public_html/api-docs/index.html
      - rm -rf web/public_html/css/*
      - rm -rf web/public_html/js/*

  container:
    desc: Build the docker image and push to Docker Hub
    method: none
    cmds:
      - |
        echo "Detected container runtime: {{.BUILD_WITH}}"
        echo "Building for platforms: {{.PLATFORM_ARG}}"

        if [ "{{.BUILD_WITH}}" = "apple" ]; then
          container build \
          {{.PLATFORM_ARG}} \
          --tag {{.REGISTRY}}/knot:{{.VERSION}} \
          --build-arg VERSION={{.VERSION}} \
          --build-arg DOCKER_HUB={{.HUB}} \
          .
          echo "Tagging and pushing images for Apple container build..."
          container image tag {{.REGISTRY}}/knot:{{.VERSION}} {{.REGISTRY}}/knot:latest
          container images push {{.REGISTRY}}/knot:{{.VERSION}}
          container images push {{.REGISTRY}}/knot:latest
        elif [ "{{.BUILD_WITH}}" = "podman" ]; then
          podman manifest create {{.REGISTRY}}/knot:{{.VERSION}}
          podman build \
            {{.PLATFORM_ARG}} \
            --manifest {{.REGISTRY}}/knot:{{.VERSION}} \
            .
          podman tag {{.REGISTRY}}/knot:{{.VERSION}} {{.REGISTRY}}/knot:latest
          podman manifest push {{.REGISTRY}}/knot:{{.VERSION}}
          podman manifest push {{.REGISTRY}}/knot:latest
        else
          docker buildx build \
          {{.PLATFORM_ARG}} \
          --tag {{.REGISTRY}}/knot:{{.VERSION}} \
          --tag {{.REGISTRY}}/knot:latest \
          --build-arg VERSION={{.VERSION}} \
          --build-arg DOCKER_HUB={{.HUB}} \
          --push \
          .
        fi

  release:
    desc: Tag, build, push container, create GitHub release, checksums, and update Homebrew
    cmds:
      - |
        # Check if tag exists
        if git tag -l v{{.VERSION}} | grep -q v{{.VERSION}}; then
          echo "Tag v{{.VERSION}} already exists, skipping tag creation"
        else
          echo "Creating tag v{{.VERSION}}"
          git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
          git push origin v{{.VERSION}}
        fi
      - task: all
      - task: container
      - task: create-release
      - task: checksums
      - task: homebrew-formula

  tag:
    desc: Tag the current code with the derived version
    cmds:
      - git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin v{{.VERSION}}
    status:
      - git tag -l v{{.VERSION}} # Check if tag already exists

  create-release:
    desc: Create a GitHub release with the built artifacts
    internal: true
    cmds:
      - gh release create v{{.VERSION}} {{.OUTPUT_DIR}}/*.zip -t "Release {{.VERSION}}" -n "Knot {{.VERSION}}"
    deps: [all] # Ensure artifacts exist

  run-server:
    desc: Run the server for development
    deps: [agents, packages, webassets]
    cmds:
      - go run . server --log-level=debug --download-path={{.OUTPUT_DIR}} --html-path=./web/public_html --template-path=./web/templates --agent-path={{.AGENT_OUTPUT_DIR}} --package-path=./web/packages
    ignore_error: true

  run-desktop:
    desc: Run the desktop app for development
    deps: [agents, packages, webassets]
    cmds:
      - go run . --log-level=debug --download-path={{.OUTPUT_DIR}} --html-path=./web/public_html --template-path=./web/templates --agent-path={{.AGENT_OUTPUT_DIR}} --package-path=./web/packages
    ignore_error: true

  icons:
    desc: Generate the monochrome desktop tray icons from the web UI logo SVG
    cmds:
      - |
        if ! command -v rsvg-convert >/dev/null 2>&1; then
          echo "rsvg-convert not found (brew install librsvg) — note: qlmanage is NOT a usable fallback, it flattens transparency" >&2
          exit 1
        fi
        render() {
          sed "s/fill:url(#[A-Za-z0-9_]*)/fill:${1}/g" web/public_html/images/logo.svg > /tmp/knot-icon.svg
          # Render large, thin the strokes (erosion), then downsample — a
          # straight 44px render of the logo is too blocky for the menu bar.
          rsvg-convert -w 1006 -h 1006 /tmp/knot-icon.svg -o /tmp/knot-icon-src.png
          go run ./scripts/iconthin -size 44 -erode 12 /tmp/knot-icon-src.png "${2}"
        }
        render '#000000' internal/desktop/icon.png
        render '#ffffff' internal/desktop/icon-white.png
        cp web/public_html/favicon.ico internal/configwizard/static/favicon.ico
      - |
        # Regenerate the macOS .app icon from the full colour logo
        if ! command -v iconutil >/dev/null 2>&1; then
          echo "iconutil not found (macOS only) — skipping build/darwin/icon.icns" >&2
          exit 0
        fi
        rm -rf /tmp/Knot.iconset && mkdir -p /tmp/Knot.iconset
        for size in 16 32 128 256 512; do
          rsvg-convert -w ${size} -h ${size} web/public_html/images/logo.svg -o /tmp/Knot.iconset/icon_${size}x${size}.png
          rsvg-convert -w $((size*2)) -h $((size*2)) web/public_html/images/logo.svg -o /tmp/Knot.iconset/icon_${size}x${size}@2x.png
        done
        iconutil -c icns /tmp/Knot.iconset -o build/darwin/icon.icns
      - |
        # Regenerate the Windows exe icon resource
        rm -rf /tmp/knot-ico && mkdir -p /tmp/knot-ico
        for size in 16 32 48 256; do
          rsvg-convert -w ${size} -h ${size} web/public_html/images/logo.svg -o /tmp/knot-ico/${size}.png
        done
        go run ./scripts/genico build/windows/icon.ico /tmp/knot-ico/16.png /tmp/knot-ico/32.png /tmp/knot-ico/48.png /tmp/knot-ico/256.png
        go run github.com/akavel/rsrc@latest -ico build/windows/icon.ico -arch amd64 -o rsrc_windows_amd64.syso
        go run github.com/akavel/rsrc@latest -ico build/windows/icon.ico -arch arm64 -o rsrc_windows_arm64.syso

  run-leaf:
    desc: Run a leaf server for development
    deps: [agents, packages, webassets]
    cmds:
      - go run . server --log-level=debug --download-path={{.OUTPUT_DIR}} --html-path=./web/public_html --template-path=./web/templates --package-path=./web/packages --config=.knot-leaf.toml
    ignore_error: true

  run-cluster2:
    desc: Run a server as a 2nd cluster member for development
    deps: [agents, packages, webassets]
    cmds:
      - go run . server --log-level=debug --download-path={{.OUTPUT_DIR}} --html-path=./web/public_html --template-path=./web/templates --package-path=./web/packages --config=.knot-cluster2.toml --hostname=podmanhost
    ignore_error: true
