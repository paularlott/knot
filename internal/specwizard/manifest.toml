# Knot base image catalog.
#
# Used by the template spec wizard to present a curated picker of base images.
# Each [[image]] entry is a single selectable image.
#
# The `image` field may contain template variables resolved at deploy time via
# the standard Go template engine using ${{ ... }} delimiters. The most common
# variable is ${{ .server.base_image_registry }} which resolves to the
# configured `base-image-registry` (default "docker.io/paularlott"). Use an
# absolute reference (e.g. "ghcr.io/foo/bar:1") to bypass the registry prefix.
#
# `icon` references an icon served by knot at /icons/<name>.svg (see
# internal/service/icons.go for the bundled set). Replace this whole file via
# `base-images-manifest` to use a custom catalog and custom icon URLs.
#
# Each [[image.volume]] declares a persistent mount point. Its `name` is the
# suggested name for the managed volume the wizard pre-fills; it SHOULD include
# `${{ .space.id }}` so the resolved name is unique per space and won't clash
# with other spaces' volumes on the same host (e.g. named Docker volumes are
# global per daemon). Template variables are resolved at deploy time.
#
# To regenerate from the knot-base-images repo: copy the OCI image labels from
# docker-bake.hcl (title, description, version) into the matching fields here.

# Catalog schema version. Bump only when the structure of this file changes
# incompatibly.
version = 1
# Catalog revision (yyyymmddbb = date + same-day build counter). Used to tell
# whether a manifest fetched from getknot.dev is newer than the one compiled
# into this binary. Lexicographic compare == chronological compare.
manifest_version = "2026082001"
description = "Default knot base image catalog"

# ── Base Ubuntu ────────────────────────────────────────────────────────────

[[image]]
name            = "ubuntu-26.04"
display_name    = "Ubuntu 26.04"
description     = "Base Ubuntu 26.04 image with knot startup scripts and common dev tools. Use this when you just need a shell."
image           = "${{ .server.base_image_registry }}/knot-ubuntu:26.04"
icon            = "/icons/ubuntu-linux-alt.svg"
category        = "base"
default_memory  = "2G"
recommended     = true

[[image.volume]]
path        = "/home"
name        = "${{ .space.id }}-home"
description = "Persistent home directory (user files, projects, shell config)."

[[image]]
name            = "ubuntu-24.04"
display_name    = "Ubuntu 24.04"
description     = "Base Ubuntu 24.04 image with knot startup scripts and common dev tools. LTS release."
image           = "${{ .server.base_image_registry }}/knot-ubuntu:24.04"
icon            = "/icons/ubuntu-linux-alt.svg"
category        = "base"
default_memory  = "2G"

[[image.volume]]
path        = "/home"
name        = "${{ .space.id }}-home"
description = "Persistent home directory (user files, projects, shell config)."

