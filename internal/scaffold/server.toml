# Server configuration
[server]

# Address and port to listen on
listen = "0.0.0.0:3000"

# Address and port to listen on for agents
listen_agent = "0.0.0.0:3010"

# Address and port for the agents to connect to
agent_endpoint = "srv+knot-server-agent.service.consul"

# The URL to the Knot server (used for the web interface)
url = "https://knot.internal"

# The wildcard domain to expose the web interface of spaces on
#wildcard_domain = "*.knot.internal"

# Encryption key for protected variables (knot genkey)
#encrypt = "VF9hmdXZyzNF3rcP6M0P"

# Optional server zone, defaults to the hostname
#zone = "myservers"

# Audit log settings live in [server.audit] below; the older flat keys
# (audit_routing / audit_retention / audit_stream) are still accepted.
#
# Failed-login blocking (auth_ip_rate_limiting = true): block auth after
# auth_rate_limit_attempts failures within auth_rate_limit_window seconds,
# for auth_rate_limit_block seconds.
# auth_ip_rate_limiting = true
# auth_rate_limit_attempts = 10
# auth_rate_limit_window = 60
# auth_rate_limit_block = 300

[server.audit]
# Audit log routing: internal (default), external, or both. With external /
# both, audit events are sent to [log.output]; the internal store expires
# entries after retention days.
# routing = "internal"
# retention = 90
# Stream label used when routing audit logs to the external log driver.
# stream = "audit"

# Data-access auditing for spaces holding production data copies — both off
# by default (noisy for local development). File operations record path and
# byte count only, never content; sessions record terminal, SSH and VS
# Code tunnel opens per space and user.
# file_operations = false
# space_sessions = false

[server.terminal]
webgl = true

# MySQL storage
[server.mysql]
enabled = false
# MySQL host if prefixed with srv+ then SRV+ lookup will be performed
host = "localhost"
port = 3306
user = "root"
password = ""
database = "knot"

# BadgerDB storage
[server.badgerdb]
enabled = false
path = "./badgerdb/"

# Redis storage
[server.redis]
enabled = false
# Redis host if prefixed with srv+ then SRV+ lookup will be performed
hosts = ["localhost:6379"]
password = ""
db = 0

[server.nomad]
addr = "http://127.0.0.1:4646"
token = ""
# Datacenter and region exposed as ${{ .nomad.dc }} / ${{ .nomad.region }} and
# pre-filled into new Nomad jobs. Default to the NOMAD_DC / NOMAD_REGION env
# vars (set automatically when knot runs as a Nomad job) when left empty.
#dc = ""
#region = ""

# MCP (Model Context Protocol) server
[server.mcp]
enabled = false
#disable_builtin_tools = []  # List of built-in tool names to disable

# Remote MCP servers (optional)
# Uncomment and configure to connect to external MCP servers
# [[server.mcp.remote_servers]]
#   namespace = "ai"
#   url = "https://ai.example.com/mcp"
#   token = "your-bearer-token"
#   hidden = false  # Set to true to hide tools from ListTools (callable but not listed)
#
# [[server.mcp.remote_servers]]
#   namespace = "data"
#   url = "https://data.example.com/mcp"
#   token = "your-data-service-bearer-token"
#   hidden = false
#
# [[server.mcp.remote_servers]]
#   namespace = "internal"
#   url = "https://internal.example.com/mcp"
#   token = "your-internal-service-bearer-token"
#   hidden = true  # Hidden tools - callable from scripts but not listed

# [server.cluster]
# advertise_addr = "https://knot.example.com/"
# key = "VF9hmdXZyzNF3rcP6M0P" # knot genkey
# peers = [
#   "wss://knot.example.com",
#   "wss://knot1.example.com",
#   "wss://knot2.example.com"
# ]

# Optional nameservers to use for SRV lookups
# [resolver]
#   consul = ["192.168.0.4:8600"]
#   nameservers = ["192.168.0.2:53"]

[log]
level = "info"

# HTTP log driver (unset = stderr only)
# [log.output]
#   format = "ndjson"                                          # ndjson | loki | elasticsearch | gelf
#   stream = "knot"                                            # stream name / identifier
#   username = ""                                               # optional HTTP basic auth (e.g. VictoriaLogs tenant)
#   password = ""                                               # optional HTTP basic auth password / token
#   # VictoriaLogs endpoints:
#   # url = "http://localhost:9428/insert/jsonline"            # ndjson
#   # url = "http://localhost:9428/loki/api/v1/push"           # loki
#   # url = "http://localhost:9428/insert/elasticsearch/_bulk" # elasticsearch
#   # Graylog:
#   # url = "http://graylog.example.com:12201/gelf"            # gelf
