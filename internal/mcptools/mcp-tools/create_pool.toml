description = "Create a pool of identical spaces from a template. The pool keeps a target number of spaces running and can serve HTTP/TCP traffic under the pool name."
keywords = ["create", "pool", "new", "scale", "replicas", "deploy"]
discoverable = true
requires_approval = true

[[parameters]]
name = "name"
type = "string"
description = "Name of the pool. Also used as the routing name for HTTP/TCP ports (username--poolname--port.domain)."
required = true

[[parameters]]
name = "template_name"
type = "string"
description = "Name of the template to use for pool member spaces"
required = true

[[parameters]]
name = "desired_count"
type = "int"
description = "Number of spaces to create in the pool"
required = false

[[parameters]]
name = "startup_script_name"
type = "string"
description = "Name of a startup script to run on each pool member (optional)"
required = false

[[parameters]]
name = "active"
type = "bool"
description = "Start the pool immediately after creation"
required = false

[[parameters]]
name = "lease_max_time"
type = "int"
description = "Enable exclusive member leases: -1 = lease until released, a positive number of seconds = maximum lease length, 0 = leases off (default)"
required = false

[[parameters]]
name = "lease_max_extensions"
type = "int"
description = "Times a lease may be extended: -1 = unlimited, 0 = none (default)"
required = false

[[parameters]]
name = "custom_fields"
type = "array:string"
description = "Optional custom field values given to every member, as name=value strings, for example [\"ENV=dev\", \"ROLE=api\"]; fields left out get the template default"
required = false
